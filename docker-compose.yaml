services:
  redis:
    image: redis:7-alpine
    container_name: kb_redis
    ports:
      - 6379:6379
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # Redis Web GUI: RedisInsight
  redisinsight:
    image: redis/redisinsight:2.50
    container_name: kb_redisinsight
    ports:
      - 5540:5540
    environment:
      - RI_HOST=0.0.0.0
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redisinsight:/data
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy


  postgres:
    image: pgvector/pgvector:pg16
    container_name: kb_postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kb
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d hello_pg']
      interval: 5s
      timeout: 5s
      retries: 5


  # PostgreSQL GUI (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kb_pgadmin
    ports:
      - 8088:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/pgadmin:/var/lib/pgadmin
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/login']
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      - postgres

networks:
  default:
    name: common-network