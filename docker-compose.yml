services:
  # PostgreSQL
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge_base_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: knowledge_base
    ports:
      - '5432:5432'
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
      - ./init-scripts/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d hello_pg']
      interval: 5s
      timeout: 5s
      retries: 5

  # PostgreSQL GUI (pgAdmin)
  pgadmin:
    container_name: knowledge_base_pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/pgadmin:/var/lib/pgadmin
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/login']
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - '8088:80'
    depends_on:
      - postgres

  # MongoDB 主库
  mongodb:
    image: mongo:7-jammy
    container_name: knowledge_base_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: knowledge_base
    ports:
      - '27017:27017'
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongo:/data/db
      - ./init-scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--eval',
          "db.adminCommand('ping')",
          '-u',
          '${MONGO_INITDB_ROOT_USERNAME}',
          '-p',
          '${MONGO_INITDB_ROOT_PASSWORD}',
          '--authenticationDatabase',
          'admin',
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  # MongoDB Web GUI: mongo-express
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: knowledge_base_mongo_express
    restart: always
    ports:
      - '8081:8081'
    environment:
      # 连接 mongo 数据库账号（和mongodb服务保持一致）
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      # mongo-express 网页登录账号（区分数据库账号）
      ME_CONFIG_BASICAUTH_ENABLED: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
      # 编辑器暗色主题
      ME_CONFIG_OPTIONS_EDITORTHEME: '3024-night'
    # 等待mongodb健康就绪再启动
    depends_on:
      mongodb:
        condition: service_healthy

networks:
  default:
    name: common-network
